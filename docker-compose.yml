# Local PostgreSQL + Redis. Then set DATABASE_URL and REDIS_URL in .env (see .env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: totaltrip
      POSTGRES_PASSWORD: totaltrip
      POSTGRES_DB: totaltrip
    ports: ["127.0.0.1:5432:5432"]  # this machine only: the password is for local development
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]  # this machine only: Redis has no password here
volumes:
  pgdata:
